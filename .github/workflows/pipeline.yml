name: F1 Fantasy Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/interim/**'
  workflow_dispatch:
    inputs:
      season:
        description: 'Season (e.g. 2026)'
        required: true
        type: string
      round:
        description: 'Round number'
        required: true
        type: string

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: pip install -e . --quiet

      - name: Detect season and round from pushed data
        id: detect
        run: |
          if [ -n "${{ inputs.season }}" ] && [ -n "${{ inputs.round }}" ]; then
            echo "season=${{ inputs.season }}" >> "$GITHUB_OUTPUT"
            echo "round=${{ inputs.round }}" >> "$GITHUB_OUTPUT"
          else
            # find the latest interim race file to determine season/round
            LATEST=$(ls -1 data/interim/races/*.parquet 2>/dev/null | sort | tail -1)
            if [ -z "$LATEST" ]; then
              echo "No interim race data found"
              exit 1
            fi
            STEM=$(basename "$LATEST" .parquet)
            echo "season=${STEM%%_*}" >> "$GITHUB_OUTPUT"
            echo "round=$(echo ${STEM##*_} | sed 's/^0*//')" >> "$GITHUB_OUTPUT"
          fi

      - name: Build targets
        run: |
          python -m app.interface.cli build-targets \
            --season ${{ steps.detect.outputs.season }} \
            --round  ${{ steps.detect.outputs.round }}

      - name: Build prices
        run: |
          python -m app.interface.cli build-prices \
            --season ${{ steps.detect.outputs.season }}

      - name: Build features
        run: |
          python -m app.interface.cli build-features \
            --season ${{ steps.detect.outputs.season }} \
            --round  ${{ steps.detect.outputs.round }}

      - name: Generate reports
        run: |
          SEASON=${{ steps.detect.outputs.season }}
          ROUND=${{ steps.detect.outputs.round }}
          PRICES="data/processed/prices/${SEASON}_$(printf '%02d' $ROUND).parquet"
          if [ -f "$PRICES" ]; then
            python -m app.interface.cli generate-reports \
              --season $SEASON \
              --round  $ROUND
          else
            echo "No prices file at $PRICES - skipping generate-reports"
          fi

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/ reports/
          git diff --staged --quiet || git commit -m "Pipeline run: ${{ steps.detect.outputs.season }} round ${{ steps.detect.outputs.round }}" && git push
