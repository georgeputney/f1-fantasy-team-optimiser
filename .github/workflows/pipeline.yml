name: F1 Fantasy Pipeline

on:
  workflow_call:
    inputs:
      season:
        type: string
        required: true
      round:
        type: string
        required: true
      trigger:
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      season:
        description: 'Season (e.g. 2026)'
        required: true
        type: string
      round:
        description: 'Round number'
        required: true
        type: string
      trigger:
        description: 'Trigger type (pre-race or post-race)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          pip install -e ".[pipeline]" --quiet
          playwright install chromium --with-deps

      - name: Setup Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install -y --no-install-recommends cloudflare-warp
          sudo warp-cli --accept-tos registration new
          sudo warp-cli --accept-tos mode warp+doh
          sudo warp-cli --accept-tos connect
          sleep 10
          curl -s https://www.cloudflare.com/cdn-cgi/trace

      - name: Create FastF1 cache directory
        run: mkdir -p data/raw/fastf1_cache

      # re-ingest previous round to pick up data that may have been unavailable earlier
      - name: Process previous round
        run: |
          PREV=$(( ${{ inputs.round }} - 1 ))
          if [ $PREV -lt 1 ]; then exit 0; fi
          python -m app.interface.cli ingest-data   --season ${{ inputs.season }} --round $PREV || true
          python -m app.interface.cli clean-data    --season ${{ inputs.season }} --round $PREV || true
          python -m app.interface.cli build-targets --season ${{ inputs.season }} --round $PREV || true
          python -m app.interface.cli build-prices  --season ${{ inputs.season }} || true
          python -m app.interface.cli build-features --season ${{ inputs.season }} --round $PREV || true

      - name: Ingest current round
        run: |
          python -m app.interface.cli ingest-data \
            --season ${{ inputs.season }} \
            --round  ${{ inputs.round }} || true

      - name: Clean current round
        run: |
          python -m app.interface.cli clean-data \
            --season ${{ inputs.season }} \
            --round  ${{ inputs.round }} || true

      - name: Build targets
        run: |
          python -m app.interface.cli build-targets \
            --season ${{ inputs.season }} \
            --round  ${{ inputs.round }} || true

      - name: Build prices
        run: |
          python -m app.interface.cli build-prices --season ${{ inputs.season }}

      - name: Build features
        run: |
          python -m app.interface.cli build-features \
            --season ${{ inputs.season }} \
            --round  ${{ inputs.round }}

      - name: Generate reports
        run: |
          PRICES="data/processed/prices/${{ inputs.season }}_$(printf '%02d' ${{ inputs.round }}).parquet"
          if [ -f "$PRICES" ]; then
            python -m app.interface.cli generate-reports \
              --season ${{ inputs.season }} \
              --round  ${{ inputs.round }} \
              --trigger "${{ inputs.trigger }}"
          else
            echo "No prices file at $PRICES - skipping generate-reports"
          fi

      - name: Run backtest
        if: inputs.trigger == 'post-race'
        run: |
          python -m app.interface.cli backtest \
            --season ${{ inputs.season }} --save-state || true

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/interim/ data/processed/ reports/ data/team_state_file.json
          SEASON=${{ inputs.season }}
          ROUND=${{ inputs.round }}
          TRIGGER="${{ inputs.trigger }}"
          if [ "$TRIGGER" = "pre-race" ]; then
            MSG="Post-FP3 predictions for $SEASON round $ROUND"
          elif [ "$TRIGGER" = "post-fp2" ]; then
            MSG="Post-FP2 preliminary predictions for $SEASON round $ROUND"
          elif [ "$TRIGGER" = "post-race" ]; then
            MSG="Post-race preliminary predictions for $SEASON round $ROUND"
          else
            MSG="Pipeline run: $SEASON round $ROUND"
          fi
          git diff --staged --quiet || git commit -m "$MSG" && git push
