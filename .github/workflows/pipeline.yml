name: F1 Fantasy Pipeline

on:
  workflow_call:
    inputs:
      season:
        type: string
        required: true
      round:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      season:
        description: 'Season (e.g. 2026)'
        required: true
        type: string
      round:
        description: 'Round number'
        required: true
        type: string

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: pip install -e . --quiet

      - name: Setup Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install -y cloudflare-warp
          sudo warp-cli registration new
          sudo warp-cli mode warp
          sudo warp-cli connect
          sleep 5
          echo "WARP IP: $(curl -s ifconfig.me)"

      - name: Create FastF1 cache directory
        run: mkdir -p data/raw/fastf1_cache

      # re-ingest previous round to pick up data that may have been unavailable earlier
      - name: Process previous round
        run: |
          PREV=$(( ${{ inputs.round }} - 1 ))
          if [ $PREV -lt 1 ]; then exit 0; fi
          python -m app.interface.cli ingest-data   --season ${{ inputs.season }} --round $PREV || true
          python -m app.interface.cli clean-data    --season ${{ inputs.season }} --round $PREV || true
          python -m app.interface.cli build-targets --season ${{ inputs.season }} --round $PREV || true
          python -m app.interface.cli build-prices  --season ${{ inputs.season }} || true
          python -m app.interface.cli build-features --season ${{ inputs.season }} --round $PREV || true

      - name: Ingest current round
        run: |
          python -m app.interface.cli ingest-data \
            --season ${{ inputs.season }} \
            --round  ${{ inputs.round }} || true

      - name: Clean current round
        run: |
          python -m app.interface.cli clean-data \
            --season ${{ inputs.season }} \
            --round  ${{ inputs.round }} || true

      - name: Build targets
        run: |
          python -m app.interface.cli build-targets \
            --season ${{ inputs.season }} \
            --round  ${{ inputs.round }} || true

      - name: Build prices
        run: |
          python -m app.interface.cli build-prices --season ${{ inputs.season }}

      - name: Build features
        run: |
          python -m app.interface.cli build-features \
            --season ${{ inputs.season }} \
            --round  ${{ inputs.round }}

      - name: Generate reports
        run: |
          PRICES="data/processed/prices/${{ inputs.season }}_$(printf '%02d' ${{ inputs.round }}).parquet"
          if [ -f "$PRICES" ]; then
            python -m app.interface.cli generate-reports \
              --season ${{ inputs.season }} \
              --round  ${{ inputs.round }}
          else
            echo "No prices file at $PRICES - skipping generate-reports"
          fi

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/interim/ data/processed/ reports/
          git diff --staged --quiet || git commit -m "Pipeline run: ${{ inputs.season }} round ${{ inputs.round }}" && git push
