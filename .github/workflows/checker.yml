name: Race Weekend Checker

on:
  schedule:
    - cron: '0 * * * *'   # every hour - fast once pip is cached
  workflow_dispatch: {}   # manual trigger for testing

permissions:
  contents: write          # inherited by the called pipeline workflow

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      season:     ${{ steps.check.outputs.season }}
      round:      ${{ steps.check.outputs.round }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install FastF1
        run: pip install fastf1 --quiet

      - name: Check trigger session availability
        id: check
        run: python .github/scripts/check_race_weekend.py

  pipeline:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    uses: ./.github/workflows/pipeline.yml
    with:
      season: ${{ needs.check.outputs.season }}
      round:  ${{ needs.check.outputs.round }}
    secrets: inherit
