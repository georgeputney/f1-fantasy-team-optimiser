name: Retrain Production Models

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Reason for retraining (for commit message)'
        required: false
        default: 'manual retrain'
        type: string

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: pip install -e . --quiet

      - name: Retrain production models
        run: python -m app.interface.cli train-model --prod

      - name: Commit updated artifacts
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/artifacts/
          if git diff --staged --quiet; then
            echo "No artifact changes."
          else
            git commit -m "chore: retrain prod models — ${{ inputs.note }}"
            git push
          fi
